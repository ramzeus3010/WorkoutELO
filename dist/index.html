<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Chetamba</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Brand palette. The app uses maroon-* classes everywhere an accent is needed —
     if this block is ever dropped, every one of those classes silently renders as
     nothing and the buttons go invisible. See workout_tracker.md §9.
     600 is the brand colour (#410038); the rest is a scale built around it. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          maroon: {
            50:  "#FAF4F8",
            100: "#F3E6EF",
            200: "#E4CCDD",
            300: "#C99CBC",
            400: "#9B5C87",
            500: "#6B2159",
            600: "#410038",
            700: "#33002C",
            800: "#260021",
            900: "#1A0016",
          },
        },
      },
    },
  };
</script>
<style>
  /* Telegram's webview can inject a dark theme; force light so form controls stay readable. */
  :root { color-scheme: light; }
  html, body {
    background: #ffffff;
    color: #111827;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  /* Global size dial. Tailwind's spacing and type scales are both in rem, so this
     scales text, padding and gaps together. 16px is the browser default; 18px is
     the "everything is a bit bigger" setting. Change this one number to retune. */
  html { font-size: 18px; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  input, select, textarea, button { color-scheme: light; font-family: inherit; }
  /* Telegram opens the app in a partially-collapsed sheet; give it real height. */
  #root { min-height: 100vh; min-height: 100dvh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
