<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Gains</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Telegram's webview can inject a dark theme; force light so form controls stay readable. */
  :root { color-scheme: light; }
  html, body {
    background: #ffffff;
    color: #111827;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  input, select, textarea, button { color-scheme: light; font-family: inherit; }
  /* Telegram opens the app in a partially-collapsed sheet; give it real height. */
  #root { min-height: 100vh; min-height: 100dvh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
